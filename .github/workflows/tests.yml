name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      pytest_args: ${{ steps.scope.outputs.pytest_args }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: python3 tools/ci_scope.py --base "$CI_BASE" --head "$CI_HEAD"
  test:
    name: test (3.13.5)
    needs: scope
    if: needs.scope.outputs.profile != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-weave.txt
            requirements-dev.txt
            requirements-homes.txt
            requirements-home-login.txt
            constraints.txt
      - name: Harden and record the trusted qualification interpreter
        if: needs.scope.outputs.profile == 'full'
        env:
          EXPECTED_PYTHON: "3.13.5"
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import stat
          import subprocess
          import sys
          from pathlib import Path

          from tools.qualify_offline import _owner_file

          def normalised_mode(info):
              return stat.S_IMODE(info.st_mode) & ~0o022

          def digest_file(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              digest = hashlib.sha256()
              try:
                  before = os.fstat(descriptor)
                  while chunk := os.read(descriptor, 1024 * 1024):
                      digest.update(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              identity = (before.st_dev, before.st_ino, before.st_size, before.st_mode)
              assert identity == (after.st_dev, after.st_ino, after.st_size, after.st_mode)
              return digest.hexdigest(), before

          def inventory(root, *, private):
              rows = []

              def visit(directory):
                  for entry in sorted(os.scandir(directory), key=lambda item: item.name):
                      path = Path(entry.path)
                      relative = path.relative_to(root).as_posix()
                      info = path.lstat()
                      if private:
                          assert info.st_uid == os.geteuid()
                          if not stat.S_ISLNK(info.st_mode):
                              assert stat.S_IMODE(info.st_mode) & 0o022 == 0
                      if stat.S_ISLNK(info.st_mode):
                          target = os.readlink(path)
                          if private:
                              resolved = path.resolve(strict=True)
                              assert resolved.is_relative_to(root)
                          rows.append(["symlink", relative, target])
                      elif stat.S_ISDIR(info.st_mode):
                          rows.append(["directory", relative, normalised_mode(info)])
                          visit(path)
                      elif stat.S_ISREG(info.st_mode):
                          if private:
                              assert info.st_nlink == 1
                          digest, opened = digest_file(path)
                          assert (info.st_dev, info.st_ino, info.st_size, info.st_mode) == (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mode)
                          rows.append(["file", relative, normalised_mode(info), info.st_size, digest])
                      else:
                          raise AssertionError(f"unsupported prefix member: {relative}")

              root_info = root.lstat()
              assert stat.S_ISDIR(root_info.st_mode) and not stat.S_ISLNK(root_info.st_mode)
              if private:
                  assert root_info.st_uid == os.geteuid()
                  assert stat.S_IMODE(root_info.st_mode) & 0o022 == 0
              rows.append(["directory", ".", normalised_mode(root_info)])
              visit(root)
              return rows

          def close_permissions(root):
              for current, directories, files in os.walk(root, topdown=False, followlinks=False):
                  for name in [*directories, *files]:
                      path = Path(current) / name
                      info = path.lstat()
                      if stat.S_ISLNK(info.st_mode):
                          continue
                      assert stat.S_ISDIR(info.st_mode) or stat.S_ISREG(info.st_mode)
                      path.chmod(normalised_mode(info))
                  current_path = Path(current)
                  current_path.chmod(normalised_mode(current_path.lstat()))

          source_executable = Path(sys.executable).resolve(strict=True)
          source_prefix = Path(sys.base_prefix).resolve(strict=True)
          tool_cache = Path(os.environ["RUNNER_TOOL_CACHE"]).resolve(strict=True)
          assert f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}" == os.environ["EXPECTED_PYTHON"]
          assert source_prefix.is_relative_to(tool_cache / "Python")
          relative_executable = source_executable.relative_to(source_prefix)
          assert relative_executable.parent == Path("bin")
          source_executable_digest, source_executable_info = digest_file(source_executable)
          source_before = inventory(source_prefix, private=False)
          source_inventory = hashlib.sha256(json.dumps(source_before, separators=(",", ":")).encode()).hexdigest()

          private_parent = Path(os.environ["RUNNER_TEMP"]) / "daimon-private-python"
          private_parent.mkdir(mode=0o700)
          private_prefix = private_parent / "prefix"
          shutil.copytree(source_prefix, private_prefix, symlinks=True)
          close_permissions(private_prefix)

          source_after = inventory(source_prefix, private=False)
          private_inventory = inventory(private_prefix, private=True)
          assert source_before == source_after == private_inventory
          trusted = _owner_file(private_prefix / relative_executable, executable=True)
          trusted_digest, _trusted_info = digest_file(trusted)
          assert trusted_digest == source_executable_digest
          assert trusted.read_bytes()[:4] == b"\x7fELF"
          probe = subprocess.run(
              [os.fspath(trusted), "-I", "-c", "import sys;print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}');print(sys.base_prefix)"],
              check=True,
              capture_output=True,
              env={"LC_ALL": "C", "PATH": "/usr/bin:/bin"},
              text=True,
          ).stdout.splitlines()
          assert len(probe) == 2
          assert probe[0] == os.environ["EXPECTED_PYTHON"]
          assert Path(probe[1]).resolve(strict=True) == private_prefix
          with Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as github_path:
              github_path.write(os.fspath(private_prefix / "bin") + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_env:
              github_env.write(f"LD_LIBRARY_PATH={private_prefix / 'lib'}\n")
              github_env.write(f"PKG_CONFIG_PATH={private_prefix / 'lib/pkgconfig'}\n")
              github_env.write(f"Python_ROOT_DIR={private_prefix}\n")
              github_env.write(f"Python3_ROOT_DIR={private_prefix}\n")
              github_env.write(f"pythonLocation={private_prefix}\n")
          print(json.dumps({
              "members": len(private_inventory),
              "private_executable": os.fspath(trusted),
              "private_executable_sha256": trusted_digest,
              "private_inventory_sha256": hashlib.sha256(json.dumps(private_inventory, separators=(",", ":")).encode()).hexdigest(),
              "private_prefix": os.fspath(private_prefix),
              "source_executable": os.fspath(source_executable),
              "source_executable_identity": {"gid": source_executable_info.st_gid, "mode": oct(stat.S_IMODE(source_executable_info.st_mode)), "nlink": source_executable_info.st_nlink, "size": source_executable_info.st_size, "uid": source_executable_info.st_uid},
              "source_executable_sha256": source_executable_digest,
              "source_inventory_sha256": source_inventory,
              "source_prefix": os.fspath(source_prefix),
          }, sort_keys=True))
          PY
      - name: Verify the private interpreter is selected
        if: needs.scope.outputs.profile == 'full'
        env:
          EXPECTED_PYTHON: "3.13.5"
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          from tools.qualify_offline import _owner_file

          executable = Path(sys.executable).resolve(strict=True)
          prefix = Path(sys.base_prefix).resolve(strict=True)
          private_root = (Path(os.environ["RUNNER_TEMP"]) / "daimon-private-python").resolve(strict=True)
          assert f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}" == os.environ["EXPECTED_PYTHON"]
          assert prefix.is_relative_to(private_root)
          assert executable.parent == prefix / "bin"
          assert _owner_file(executable, executable=True) == executable
          PY
      - name: Install the offline qualification sandbox
        if: needs.scope.outputs.profile == 'full'
        run: |
          set -eu
          if ! compgen -G '/var/lib/apt/lists/*_Packages*' >/dev/null; then
            printf 'hosted runner apt package lists are missing; refusing an unbounded refresh\n' >&2
            exit 1
          fi
          sudo -n /usr/bin/timeout --kill-after=5s 120s \
            /usr/bin/apt-get install \
            --yes \
            --no-install-recommends \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Dpkg::Lock::Timeout=30 \
            -o Dpkg::Use-Pty=0 \
            bubblewrap
          test "$(dpkg-query -W -f='${Status}' bubblewrap)" = 'install ok installed'
          test -x /usr/bin/bwrap
      - name: Prove the disposable runner supports the qualification sandbox
        if: needs.scope.outputs.profile == 'full'
        run: |
          set -eu
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if test -e "$restriction"; then
            test "${RUNNER_ENVIRONMENT:-}" = github-hosted
            before=$(cat "$restriction")
            if test "$before" != 0; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            test "$(cat "$restriction")" = 0
            printf 'CI-only user-namespace restriction: %s -> %s\n' \
              "$before" "$(cat "$restriction")"
          fi
          host_net_namespace=$(readlink /proc/self/ns/net)
          private_prefix=${pythonLocation:?}
          private_python=$(python -I -c 'import os,sys; print(os.path.basename(sys.executable))')
          preflight_root=$(mktemp -d "$RUNNER_TEMP/daimon-bwrap-preflight.XXXXXX")
          chmod 700 "$preflight_root"
          trap 'rm -rf "$preflight_root"' EXIT
          /usr/bin/bwrap \
            --die-with-parent \
            --unshare-all \
            --new-session \
            --clearenv \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt \
            --tmpfs /tmp \
            --dev /dev \
            --proc /proc \
            --ro-bind "$private_prefix" /python \
            --dir /work \
            --bind "$preflight_root" /work \
            --setenv PATH /usr/bin:/bin \
            --setenv HOME /work/home \
            --setenv TMPDIR /work/tmp \
            --setenv LD_LIBRARY_PATH /python/lib \
            --setenv PRIVATE_PYTHON "$private_python" \
            --setenv HOST_NET_NAMESPACE "$host_net_namespace" \
            /bin/bash -ceu \
              'test "$(readlink /proc/self/ns/net)" != "$HOST_NET_NAMESPACE"; test "$(wc -l < /proc/net/route)" -eq 1; test ! -e /home/runner; test ! -e /run/docker.sock; mkdir -m 700 "$HOME" "$TMPDIR"; test "$("/python/bin/$PRIVATE_PYTHON" -I -c "import sys; print(sys.base_prefix)")" = /python; "/python/bin/$PRIVATE_PYTHON" -m venv --copies /work/venv; test "$(/work/venv/bin/python -I -c "import sys; print(sys.base_prefix)")" = /python'
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Install optional home passkey adapter
        if: needs.scope.outputs.profile == 'homes' || needs.scope.outputs.profile == 'full'
        run: python -m pip install -c constraints.txt -r requirements-homes.txt -r requirements-home-login.txt
      - name: Verify exact Matrix source pin
        run: |
          python - <<'PY'
          import importlib.metadata
          import json

          from clusterctl.matrix_host import MATRIX_CONTRACT_COMMIT

          direct_url = json.loads(
              importlib.metadata.distribution("daimon-matrix").read_text(
                  "direct_url.json"
              )
          )
          assert direct_url["vcs_info"]["commit_id"] == MATRIX_CONTRACT_COMMIT
          assert (
              importlib.metadata.distribution("daimon-matrix")
              .metadata["License-Expression"]
              == "MIT"
          )
          PY
      - name: Lint the Matrix, fence and mutation-journal boundaries
        run: >-
          python -m ruff check
          clusterctl/admission.py
          clusterctl/admission_supervisor.py
          clusterctl/audit.py
          clusterctl/adapters.py
          clusterctl/cli.py
          clusterctl/being_seed.py
          clusterctl/onboarding_consent.py
          clusterctl/onboarding_approvals.py
          tests/test_onboarding_approvals.py
          clusterctl/onboarding_custody.py
          clusterctl/onboarding_credential.py
          clusterctl/onboarding_holder_backup.py
          clusterctl/onboarding_sdk.py
          clusterctl/onboarding_receiving_update.py
          tests/test_receiving_update_preflight.py
          tests/test_receiving_update_selection.py
          clusterctl/onboarding_target.py
          clusterctl/onboarding_existing.py
          clusterctl/onboarding_enrollment.py
          clusterctl/onboarding_enrollment_root.py
          clusterctl/onboarding_code_successor.py
          clusterctl/onboarding_peer.py
          clusterctl/onboarding_peer_host.py
          clusterctl/onboarding_source.py
          tests/test_onboarding_source.py
          tests/test_onboarding_peer_host.py
          clusterctl/onboarding_local_body.py
          tests/test_onboarding_local_body.py
          clusterctl/onboarding_admission.py
          clusterctl/onboarding_runtime.py
          clusterctl/onboarding_service.py
          clusterctl/onboarding_ssh.py
          tests/test_onboarding_ssh.py
          clusterctl/onboarding_ingress.py
          tests/test_onboarding_ingress.py
          clusterctl/onboarding_provider.py
          clusterctl/onboarding_intake.py
          tests/test_onboarding_intake.py
          clusterctl/onboarding_telegram.py
          tests/test_onboarding_telegram.py
          clusterctl/onboarding_accounts.py
          clusterctl/onboarding_welcome.py
          tests/test_onboarding_welcome.py
          clusterctl/onboarding_actions.py
          tests/test_onboarding_provider.py
          tests/test_onboarding_actions.py
          tests/test_onboarding_accounts.py
          tests/test_onboarding_shared_login.py
          tools/configure_onboarding_account.py
          tools/install_onboarding_worker.py
          tools/export_local_matrix_identity.py
          tests/test_onboarding_worker_install.py
          clusterctl/onboarding_managed.py
          clusterctl/onboarding_registry.py
          clusterctl/onboarding_authority.py
          tests/test_onboarding_host_ownership.py
          tests/test_onboarding_runtime.py
          tests/test_onboarding_service.py
          tests/test_onboarding_code_successor.py
          tests/test_onboarding_peer.py
          tests/test_onboarding_managed.py
          tests/test_onboarding_admission.py
          clusterctl/owner_process.py
          clusterctl/browser.py
          clusterctl/distributed_rebirth.py
          clusterctl/embodiments.py
          clusterctl/fences.py
          clusterctl/idempotency.py
          clusterctl/inventory.py
          clusterctl/production_fences.py
          clusterctl/leases.py
          clusterctl/locks.py
          clusterctl/lifecycle.py
          clusterctl/matrix_host.py
          clusterctl/operation_journal.py
          clusterctl/park.py
          clusterctl/reconcile.py
          clusterctl/rebirth.py
          clusterctl/rebirth_host.py
          clusterctl/recovery_rebirth.py
          clusterctl/transfer.py
          clusterd/__main__.py
          clusterd/approvals.py
          clusterd/auth.py
          clusterd/confirm.py
          clusterd/handlers.py
          clusterd/seed_handlers.py
          clusterd/seed_ui.py
          clusterd/openapi.py
          clusterd/routes.py
          clusterd/server.py
          steward_tools/mutations.py
          tests/test_matrix_host.py
          tests/test_matrix_v8_snapshot.py
          tests/test_embodiments.py
          tests/test_being_seed.py
          tests/test_onboarding_consent.py
          tests/test_onboarding_custody.py
          tests/test_onboarding_credential.py
          tests/test_onboarding_sdk.py
          tests/test_onboarding_target_authorization.py
          tests/test_onboarding_target.py
          tests/test_onboarding_existing.py
          scripts/being-seed
          tests/test_admission.py
          tests/test_matrix_host_process.py
          tests/test_matrix_parity.py
          tests/test_matrix_status.py
          tests/test_operation_journal.py
          tests/test_park.py
          tests/test_production_fences.py
          tests/test_rebirth.py
          tests/test_recovery_rebirth.py
          tests/integration/recovery-rebirth/role.py
          tests/integration/test_recovery_rebirth_containers.py
          tests/test_transfer.py
          tests/test_tribe_bridge_retirement.py
          tests/test_volume_relocation.py
          tests/test_human_approvals.py
          tests/test_ci_workflow.py
          tools/ci_scope.py
          tests/test_ci_scope.py
          tests/test_physical_preflight.py
          tests/test_rc_manifest.py
          scripts/h3-volume-drill.py
          tools/build_physical_preflight.py
          tools/build_rc_manifest.py
          tools/qualify_offline.py
          tools/check_rc_types.py
          tools/build_onboarding_sdk.py
      - name: Type-check the Matrix, fence and mutation-journal boundaries
        run: python tools/check_rc_types.py
      - run: >-
          python -m compileall -q clusterctl clusterd steward_tools tests tools
      - name: Prove root worker and canonical service owner separation
        if: needs.scope.outputs.profile == 'full' || needs.scope.outputs.profile == 'onboarding'
        run: |
          set -eu
          onboarding_python="$(python -c 'import sys; print(sys.executable)')"
          sudo env LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" "$onboarding_python" -m pytest -q \
            tests/test_onboarding_host_ownership.py -k 'root_worker or existing_authority' \
            -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning
      - run: >-
          python -m pytest -q
          ${{ needs.scope.outputs.pytest_args }}
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          --durations=10

  backup-export-disposable:
    needs: scope
    if: needs.scope.outputs.profile == 'full' || needs.scope.outputs.profile == 'onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
      - run: python -m pip install pytest==9.0.2
      - name: Verify disposable proof prerequisites
        run: |
          set -eu
          for tool in docker rsync ssh ssh-keygen ssh-keyscan; do
            command -v "$tool"
          done
          docker version
      - name: Prove isolated exporter and offline encrypted restore
        env:
          DAIMON_RUN_DOCKER_TESTS: "1"
        run: >-
          python -m pytest -q -s
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          tests/integration/test_restic_export_container.py

  recovery-rebirth-disposable-hosts:
    needs: scope
    if: needs.scope.outputs.profile == 'full' || needs.scope.outputs.profile == 'onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: AlterMundi/daimon-matrix
          ref: cdafbc0513d43c39f03be6e8b1b0636b9e4e9422
          path: matrix-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
      - run: python -m pip install pytest==9.0.2
      - name: Verify disposable proof prerequisites
        run: |
          set -eu
          for tool in docker git; do
            command -v "$tool"
          done
          docker version
          test "$(git -C matrix-source rev-parse HEAD)" = \
            cdafbc0513d43c39f03be6e8b1b0636b9e4e9422
      - name: Prove isolated recovery roles and read-only snapshot restore
        env:
          DAIMON_RUN_DOCKER_RECOVERY_TESTS: "1"
          DAIMON_MATRIX_SOURCE: ${{ github.workspace }}/matrix-source
        run: >-
          python -m pytest -q -s
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          tests/integration/test_recovery_rebirth_containers.py
